[package]
name = "tavily-web-search"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
serde_json = "1"

# A gene builds on its own, not as part of the playground's Rust workspace.
[workspace]

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
panic = "abort"
