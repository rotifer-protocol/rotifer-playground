name: Mutation Testing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # For the failure alarm below, which files the report as an issue.
  issues: write

jobs:
  stryker:
    name: Stryker Mutation Testing
    runs-on: ubuntu-latest
    # Measured at 4–7 minutes for 1,181 mutants across three files. A run that
    # reaches half an hour is stuck, and a stuck job that eventually reports as
    # a failure is indistinguishable from a real one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: TEMP force a failure to exercise the alarm (removed before merge)
        run: exit 1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # This used to read `npx stryker run` with no Stryker in package.json, so
      # npx fetched the deprecated `stryker` package from the registry — which
      # cannot load its own internals on Node 22. The job failed at require
      # time on every tag from v0.13.0 to v0.16.0 and measured nothing, while
      # presenting as a quality gate. `@stryker-mutator/core` is now a pinned
      # devDependency, so this resolves locally and the version is reviewable.
      - name: Verify Stryker resolves to the pinned local package
        run: |
          RESOLVED=$(node -p "require('@stryker-mutator/core/package.json').version")
          echo "@stryker-mutator/core resolved to $RESOLVED"
          test -n "$RESOLVED"

      # Nothing in the mutation scope shells out to `dist/` any more — the
      # suites that do are excluded in vitest.stryker.config.ts — but a test
      # that spawns the CLI without a build fails in the dry run, and one
      # failing dry-run test aborts the pass before a single mutant is tried.
      # That reads as a mutation-score failure when nothing was measured, and
      # it is how this job came to measure nothing from 2026-08-30 (#309)
      # onward. `npm test` in CI builds first; this keeps the two in step.
      - run: npm run build

      - name: Run Stryker (security & auth modules only)
        run: npm run test:mutation

      # This job is not a required check and runs after the release, so a
      # failure here changes nothing a human is looking at. It failed on every
      # tag from 2026-08-30 to 2026-09-21 and measured nothing on any of them;
      # it was found by accident, three weeks late. The alarm is the fix for
      # that, not the build step above: whatever breaks it next, the failure
      # now files itself where the weekly issue sweep will see it.
      #
      # One open issue at a time — later failures comment on it rather than
      # opening a second, so a gate that stays broken does not bury the sweep.
      - name: File a failed run as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh label create mutation-gate \
            --description "The mutation gate stopped measuring" \
            --color B60205 --force
          BODY=$(printf '%s\n' \
            "The mutation gate failed on \`$REF\`." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "A failure here does not always mean the score dropped. One failing test in Stryker's dry run aborts the pass before a single mutant is tried, and that reads the same way — so check whether the run reached a score at all before touching the threshold." \
            "" \
            "Filed automatically by the mutation workflow.")
          EXISTING=$(gh issue list --label mutation-gate --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "commented on #$EXISTING"
          else
            gh issue create --title "Mutation gate is not measuring" \
              --label mutation-gate --body "$BODY"
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 30
