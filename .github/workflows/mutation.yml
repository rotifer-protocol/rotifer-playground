name: Mutation Testing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker Mutation Testing
    runs-on: ubuntu-latest
    # Measured at 4–7 minutes for 1,181 mutants across three files. A run that
    # reaches half an hour is stuck, and a stuck job that eventually reports as
    # a failure is indistinguishable from a real one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # This used to read `npx stryker run` with no Stryker in package.json, so
      # npx fetched the deprecated `stryker` package from the registry — which
      # cannot load its own internals on Node 22. The job failed at require
      # time on every tag from v0.13.0 to v0.16.0 and measured nothing, while
      # presenting as a quality gate. `@stryker-mutator/core` is now a pinned
      # devDependency, so this resolves locally and the version is reviewable.
      - name: Verify Stryker resolves to the pinned local package
        run: |
          RESOLVED=$(node -p "require('@stryker-mutator/core/package.json').version")
          echo "@stryker-mutator/core resolved to $RESOLVED"
          test -n "$RESOLVED"

      - name: Run Stryker (security & auth modules only)
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 30
