name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, rust-check, security-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          node dist/index.js --version

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check (core)
        run: cargo check -p rotifer-core

      - name: Cargo test (core)
        run: cargo test -p rotifer-core

      - name: Cargo clippy
        run: cargo clippy -p rotifer-core -- -D warnings

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    needs: [rust-check, test]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cargo dependency audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit

      - name: npm dependency audit
        run: npm audit --audit-level=high || true

      - name: WASM sandbox security tests
        run: cargo test -p rotifer-core --test wasm_security

      - name: Full Rust test suite (regression check)
        run: cargo test -p rotifer-core

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Self-scan (V(g) security)
        run: |
          npm run build
          node dist/index.js vg . --json || true

      - name: Scan for cross-contamination
        run: |
          echo "Scanning full commit history for private file paths..."
          CONTAMINATED=$(git log --all --diff-filter=A --name-only --format="" | grep "^internal/" | sort -u || true)
          if [ -n "$CONTAMINATED" ]; then
            echo "::error::⛔ CRITICAL: private files found in commit history!"
            echo "$CONTAMINATED"
            echo "This public repo must NEVER contain private files."
            exit 1
          else
            echo "✅ No contamination detected"
          fi
