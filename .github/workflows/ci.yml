name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  vscode-extension:
    name: VSCode Extension Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install extension dependencies
        working-directory: rotifer-vscode
        run: npm ci

      - name: Run extension tests
        working-directory: rotifer-vscode
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, rust-check, security-check, vscode-extension]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          node dist/index.js --version

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check (core)
        run: cargo check -p rotifer-core

      - name: Cargo test (core)
        run: cargo test -p rotifer-core

      - name: Cargo clippy
        run: cargo clippy -p rotifer-core -- -D warnings

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    needs: [rust-check, test]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cargo dependency audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --quiet
          cargo audit

      - name: npm dependency audit
        run: npm audit --audit-level=high || true

      - name: WASM sandbox security tests
        run: cargo test -p rotifer-core --test wasm_security

      - name: Full Rust test suite (regression check)
        run: cargo test -p rotifer-core

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Self-scan (V(g) security)
        run: |
          npm run build
          node dist/index.js vg . --json || true

      - name: Scan for cross-contamination
        run: |
          echo "Scanning full commit history for private file paths..."
          CONTAMINATED=$(git log --all --diff-filter=A --name-only --format="" | grep "^internal/" | sort -u || true)
          if [ -n "$CONTAMINATED" ]; then
            echo "::error::⛔ CRITICAL: private files found in commit history!"
            echo "$CONTAMINATED"
            echo "This public repo must NEVER contain private files."
            exit 1
          else
            echo "✅ No contamination detected"
          fi

  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report-quality:
    name: Report to Quality Observatory
    runs-on: ubuntu-latest
    needs: [test, vscode-extension, security-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run tests with JSON reporter + coverage
        run: |
          npm run build
          npx vitest run --reporter=json --outputFile=test-results.json --coverage 2>/dev/null || true

      - name: Report test results to Supabase
        if: env.QUALITY_SUPABASE_URL != ''
        env:
          QUALITY_SUPABASE_URL: ${{ secrets.QUALITY_SUPABASE_URL }}
          QUALITY_SUPABASE_KEY: ${{ secrets.QUALITY_SUPABASE_SERVICE_KEY }}
        run: |
          if [ ! -f test-results.json ]; then
            echo "No test results file found, skipping report"
            exit 0
          fi

          VERSION=$(node -p "require('./package.json').version")
          TOTAL=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).numTotalTests || 0")
          PASSED=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).numPassedTests || 0")
          FAILED=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).numFailedTests || 0")
          DURATION=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).testResults?.reduce((s,r) => s + (r.endTime - r.startTime), 0) || 0")

          COVERAGE_PCT=0
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total?.lines?.pct || 0")
          fi

          curl -s -X POST "${QUALITY_SUPABASE_URL}/rest/v1/release_test_reports" \
            -H "apikey: ${QUALITY_SUPABASE_KEY}" \
            -H "Authorization: Bearer ${QUALITY_SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"version\": \"v${VERSION}\",
              \"component\": \"cli\",
              \"test_type\": \"unit\",
              \"total_tests\": ${TOTAL},
              \"passed\": ${PASSED},
              \"failed\": ${FAILED},
              \"duration_ms\": ${DURATION},
              \"coverage_pct\": ${COVERAGE_PCT},
              \"ci_run_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"
            }" && echo "✅ Reported to Quality Observatory (coverage: ${COVERAGE_PCT}%)" || echo "⚠️ Report failed (non-blocking)"
