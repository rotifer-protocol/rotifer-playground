name: Release VSCode Family

run-name: >-
  Release VSCode Family ${{
    github.event_name == 'workflow_dispatch' &&
    format('manual-{0}-vs{1}-ovsx{2}', inputs.version, inputs.publish_vscode, inputs.publish_openvsx) ||
    github.ref_name
  }}

on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "VSCode family version to publish"
        required: true
        type: string
      publish_vscode:
        description: "Publish to VS Code Marketplace"
        required: true
        default: true
        type: boolean
      publish_openvsx:
        description: "Publish to Open VSX"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Validate VSCode Family
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Check VSCode family trigger matches manifests
        run: |
          CONFIG_VERSION=$(node -p "require('./plugin-source/families.json').vscode.version")
          MANIFEST_VERSION=$(node -p "require('./rotifer-vscode/package.json').version")
          if [ "$CONFIG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::plugin-source/families.json vscode version $CONFIG_VERSION does not match rotifer-vscode/package.json version $MANIFEST_VERSION"
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/vscode-v* ]]; then
            TRIGGER_VERSION="${GITHUB_REF#refs/tags/vscode-v}"
          else
            TRIGGER_VERSION="${{ inputs.version }}"
          fi

          if [ "$TRIGGER_VERSION" != "$CONFIG_VERSION" ]; then
            echo "::error::Trigger version $TRIGGER_VERSION does not match plugin-source/families.json vscode version $CONFIG_VERSION"
            exit 1
          fi

      - name: Check generated plugin outputs
        run: npm run check:plugins

      - name: Verify plugin packaging references
        run: npm run verify:plugins

      - name: Install extension dependencies
        working-directory: rotifer-vscode
        run: npm ci

      - name: Run extension tests
        working-directory: rotifer-vscode
        run: npm test

  package:
    name: Package VSCode Family
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        working-directory: rotifer-vscode
        run: npm ci

      - name: Package VSCode extension
        working-directory: rotifer-vscode
        run: |
          VERSION=$(node -p "require('../plugin-source/families.json').vscode.version")
          mkdir -p ../release-artifacts
          npx --yes @vscode/vsce package --out "../release-artifacts/rotifer-vscode-${VERSION}.vsix"

      - name: Package bundled plugin manifests
        working-directory: rotifer-vscode
        run: |
          VERSION=$(node -p "require('../plugin-source/families.json').vscode.version")
          tar -czf "../release-artifacts/rotifer-vscode-family-${VERSION}.tar.gz" \
            .cursor-plugin \
            .codebuddy-plugin \
            skills \
            rules \
            assets \
            icon.png \
            package.json \
            README.md \
            CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-family
          path: release-artifacts/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          name: "Rotifer VSCode Family ${{ github.ref_name }}"
          body: |
            VSCode family release.

            This release packages the VS Code extension and its bundled plugin manifests from `plugin-source/`.
          files: |
            release-artifacts/rotifer-vscode-*.vsix
            release-artifacts/rotifer-vscode-family-*.tar.gz

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/vscode-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_vscode)
        working-directory: rotifer-vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not configured; skipping VS Code Marketplace publish."
            exit 0
          fi
          VERSION=$(node -p "require('../plugin-source/families.json').vscode.version")
          npx --yes @vscode/vsce publish --packagePath "../release-artifacts/rotifer-vscode-${VERSION}.vsix" -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/vscode-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_openvsx)
        working-directory: rotifer-vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not configured; skipping Open VSX publish."
            exit 0
          fi
          VERSION=$(node -p "require('../plugin-source/families.json').vscode.version")
          npx --yes ovsx publish "../release-artifacts/rotifer-vscode-${VERSION}.vsix"

  report-quality:
    name: Report VSCode Quality
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install extension dependencies
        working-directory: rotifer-vscode
        run: npm ci

      - name: Run extension tests with JSON reporter
        working-directory: rotifer-vscode
        run: npx vitest run --reporter=json --outputFile=test-results.json 2>/dev/null || true

      - name: Report test results to Supabase
        working-directory: rotifer-vscode
        env:
          QUALITY_SUPABASE_URL: ${{ secrets.QUALITY_SUPABASE_URL }}
          QUALITY_SUPABASE_KEY: ${{ secrets.QUALITY_SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$QUALITY_SUPABASE_URL" ] || [ -z "$QUALITY_SUPABASE_KEY" ]; then
            echo "Quality Observatory secrets not configured, skipping report"
            exit 0
          fi

          if [ ! -f test-results.json ]; then
            echo "No test results file found, skipping report"
            exit 0
          fi

          normalize_version() {
            case "$1" in
              v*) printf '%s' "$1" ;;
              *) printf 'v%s' "$1" ;;
            esac
          }

          resolve_release_line_version() {
            local fallback="$1"
            local resolved
            resolved=$(npm view @rotifer/playground version --registry https://registry.npmjs.org/ 2>/dev/null || true)
            if [ -z "$resolved" ]; then
              resolved="$fallback"
            fi
            normalize_version "$resolved"
          }

          COMPONENT_VERSION=$(normalize_version "$(node -p "require('./package.json').version")")
          RELEASE_LINE_VERSION=$(resolve_release_line_version "${COMPONENT_VERSION}")
          TOTAL=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).numTotalTests || 0")
          PASSED=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).numPassedTests || 0")
          FAILED=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).numFailedTests || 0")
          SKIPPED=$(node -p "const r=JSON.parse(require('fs').readFileSync('test-results.json','utf8')); (r.numPendingTests || 0) + (r.numTodoTests || 0)")
          DURATION=$(node -p "Math.round(JSON.parse(require('fs').readFileSync('test-results.json','utf8')).testResults?.reduce((s,r) => s + (r.endTime - r.startTime), 0) || 0)")

          if curl --fail-with-body -sS -X POST "${QUALITY_SUPABASE_URL}/rest/v1/release_test_reports" \
            -H "apikey: ${QUALITY_SUPABASE_KEY}" \
            -H "Authorization: Bearer ${QUALITY_SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"version\": \"${COMPONENT_VERSION}\",
              \"release_line_version\": \"${RELEASE_LINE_VERSION}\",
              \"component\": \"vscode\",
              \"test_type\": \"unit\",
              \"total_tests\": ${TOTAL},
              \"passed\": ${PASSED},
              \"failed\": ${FAILED},
              \"skipped\": ${SKIPPED},
              \"duration_ms\": ${DURATION},
              \"ci_run_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"
            }"; then
            echo "✅ VSCode test results reported to Quality Observatory"
          else
            echo "::warning::VSCode quality report upload failed"
          fi
