name: Publish npm Reservation

# Publishes a name-reservation package from npm-reservations/. See that
# directory's README for what these packages are and when to add one.
#
# Manual only: reservations are published once and then essentially never
# again, so there is nothing to trigger automatically. Publishing here rather
# than from a laptop keeps it on the same OIDC trusted-publishing path as every
# other @rotifer package — no long-lived npm token, no 2FA prompt, and the
# package carries provenance proving it was built from this repository, which
# is the whole point for a package that exists to prevent impersonation.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Reservation to publish (directory under npm-reservations/)"
        required: true
        type: string
      dry_run:
        description: "Pack and inspect without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve the reservation directory
        id: dir
        run: |
          # Reject anything that could escape npm-reservations/.
          case "${{ inputs.name }}" in
            */*|.*|"") echo "::error::Invalid reservation name" >&2; exit 1 ;;
          esac
          DIR="npm-reservations/${{ inputs.name }}"
          if [ ! -f "$DIR/package.json" ]; then
            echo "::error::$DIR/package.json not found" >&2
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: The package name must match its directory
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          if [ "$PKG" != "${{ inputs.name }}" ]; then
            echo "::error::package.json name '$PKG' does not match directory '${{ inputs.name }}'" >&2
            exit 1
          fi
          echo "✓ $PKG"

      - name: A reservation must point somewhere, not stand in silently
        working-directory: ${{ steps.dir.outputs.dir }}
        run: |
          BIN=$(node -p "Object.values(require('./package.json').bin || {})[0] || ''")
          if [ -z "$BIN" ]; then
            echo "::error::A reservation needs a bin that redirects users" >&2
            exit 1
          fi
          # It must refuse to act as the real tool: non-zero exit, and the
          # scoped package named in the output.
          set +e
          OUT=$(node "$BIN" --version 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -eq 0 ]; then
            echo "::error::The reservation bin exited 0 — it must not look like a working CLI" >&2
            exit 1
          fi
          if ! echo "$OUT" | grep -q "@rotifer/"; then
            echo "::error::The reservation bin does not point at a @rotifer package" >&2
            exit 1
          fi
          echo "✓ redirects and exits $CODE"

      - name: Pack
        working-directory: ${{ steps.dir.outputs.dir }}
        run: npm pack --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ steps.dir.outputs.dir }}
        run: npm publish --access public --provenance

      - name: Dry run — nothing published
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run only. Re-run with dry_run=false to publish."
