#!/usr/sbin/nft -f
# Firewall for a Rotifer public P2P node (T-231 B2 design §5.4, §7.2, §7.3).
#
# A template: `rotifer-quota load` fills the @...@ values from
# /etc/rotifer/p2p.env and the saved quota use, checks the result with
# `nft -c`, then loads it. Do not load this file by hand.
#
# Only this table is replaced; other tables (the distribution's own
# /etc/nftables.conf, Docker, ...) are left alone. Every table's chains must
# accept a packet for it to pass, so this one can only make the host stricter.

table inet rotifer
delete table inet rotifer

table inet rotifer {
	# Outbound bytes this billing period. Everything leaving the host except
	# loopback counts, whatever the port (design §7.3: the node dials from
	# fresh source ports). `used` is restored from the saved figure, so a
	# reload or reboot does not zero it.
	quota egress {
		over @QUOTA_BYTES@ bytes used @QUOTA_USED@ bytes
	}

	# Outbound rate cap, 1 MB/s (design §7.3).
	limit egress_rate {
		rate over 1 mbytes/second burst 1 mbytes
	}

	# Per-source-IP state for P2P port connections (design §7.2).
	set p2p_conn {
		type ipv4_addr
		size 65535
		flags dynamic
	}
	set p2p_rate {
		type ipv4_addr
		size 65535
		flags dynamic,timeout
		timeout 5m
	}
	# Sources dropped by either per-IP rule in the last 7 days: only their
	# number is read (rotifer-node-status), they are never logged.
	set p2p_dropped {
		type ipv4_addr
		size 65535
		flags dynamic,timeout
		timeout 7d
	}

	counter p2p_conn_drops {}
	counter p2p_rate_drops {}
	counter egress_quota_drops {}
	counter egress_rate_drops {}

	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state invalid drop
		ct state established,related accept

		# ICMP for path MTU discovery and reachability; IPv6 neighbour
		# discovery so the host keeps working on dual-stack networks.
		ip protocol icmp accept
		meta l4proto ipv6-icmp accept

		# SSH, keys only (RUNBOOK): both address families.
		tcp dport 22 accept

		# P2P, IPv4 only (CEO ruling C8). Per source IP: at most 20
		# connections at once, new ones at 30/minute with a burst of 20.
		meta nfproto ipv4 tcp dport @P2P_PORT@ ct state new add @p2p_conn { ip saddr ct count over 20 } update @p2p_dropped { ip saddr } counter name "p2p_conn_drops" drop
		meta nfproto ipv4 tcp dport @P2P_PORT@ ct state new update @p2p_rate { ip saddr limit rate over 30/minute burst 20 packets } update @p2p_dropped { ip saddr } counter name "p2p_rate_drops" drop
		meta nfproto ipv4 tcp dport @P2P_PORT@ accept
	}

	chain output {
		type filter hook output priority filter; policy accept;

		oif "lo" accept

		# SSH replies count towards the quota but always pass, so an
		# administrator is never locked out (design §7.3).
		tcp sport 22 quota name "egress"
		tcp sport 22 accept

		# Everything else: dropped once the period's quota is used up, and
		# held to 1 MB/s.
		quota name "egress" counter name "egress_quota_drops" drop
		limit name "egress_rate" counter name "egress_rate_drops" drop
	}
}
