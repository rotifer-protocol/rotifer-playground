# Supabase project configuration (deploy-relevant subset).
#
# This file exists so function deploy settings live in code instead of in
# whoever-deployed-last's shell history. On 2026-08-29 a routine
# `supabase functions deploy chat` (no flags) silently re-enabled JWT
# verification — the platform default — and 401'd every caller of the
# public chat endpoint, including the rotifer.dev chat widget, which sends
# no Authorization header by design. The function does its own protection
# (rate limiting, content filter, daily cost ceiling); the gateway JWT
# check adds nothing here and breaking it takes the assistant down.

project_id = "vihbmpuqlamhxbmahcje"

[functions.chat]
verify_jwt = false

# agent-memory (v0.9.4) serves signed-in accounts only. The gateway check
# stays on; the function also refuses a token whose role is not
# "authenticated", and RLS limits every query to the caller's own rows.
[functions.agent-memory]
verify_jwt = true

# node-attestation (v0.9.5) serves signed-in accounts only, and checks the
# caller's token itself (user-token.ts). The gateway check stays off because
# the target project signs with ES256 and Supabase documents no support for
# that key type in verify_jwt. `supabase functions deploy` turns the check
# back on unless given --no-verify-jwt.
[functions.node-attestation]
verify_jwt = false
