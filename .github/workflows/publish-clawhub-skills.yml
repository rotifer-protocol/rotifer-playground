name: Publish ClawHub Skills

# The Skills under skills/ are published to ClawHub one listing each. They
# used to live in a repository that can never be pushed, which meant no public
# source, no CI, and a manifest naming a repository that did not carry them.
#
# Real publishes happen only on a `clawhub-<skill>-v<version>` tag or a deliberate
# workflow_dispatch. Pull requests run the same path with --dry-run, so the
# publish command is exercised on every change instead of being discovered
# broken on release day — the lesson from clawhub-v2.3.0 in the
# rotifer-self-evolving-agent repo, where dry-run needed no auth and every
# check before the first real publish passed.

on:
  push:
    # One Skill per tag: clawhub-<skill>-v<version>, matching that Skill's own
    # clawhub.json. They are separate listings on separate version lines, so a
    # tag that tried to cover all of them could only ever match by accident.
    tags: ["clawhub-*-v*"]
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - ".github/workflows/publish-clawhub-skills.yml"
  workflow_dispatch:
    inputs:
      skill:
        description: "Which Skill to publish"
        type: choice
        options: [rotifer, rotifer-agent, rotifer-arena, rotifer-gene, rotifer-self-evolving-agent]
        required: true
      dry_run:
        description: "Preview without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  manifest-consistency:
    name: Manifest Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # A listing whose manifest disagrees with the directory it ships from is
      # how a Skill ends up published under a name nobody expects.
      - name: Every manifest matches its directory and carries what ClawHub reads
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          # ClawHub's summary — the line that decides both discovery and when an
          # assistant activates the Skill — is the SKILL.md frontmatter
          # description, not the clawhub.json one. Both have to be present and
          # the manifest fields have to be real, or the listing ships blank.
          REQUIRED = ("name", "display_name", "description", "version", "author", "license")

          failed = False
          for directory in sorted(pathlib.Path("skills").iterdir()):
              if not directory.is_dir():
                  continue
              manifest_path = directory / "clawhub.json"
              skill_path = directory / "SKILL.md"
              for required_file in (manifest_path, skill_path, directory / "README.md"):
                  if not required_file.exists():
                      print(f"::error::{required_file} is missing")
                      failed = True
              if not manifest_path.exists() or not skill_path.exists():
                  continue

              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              for field in REQUIRED:
                  if not manifest.get(field):
                      print(f"::error::{manifest_path} has no {field}")
                      failed = True
              if manifest.get("name") != directory.name:
                  print(
                      f"::error::{manifest_path} is named {manifest.get('name')!r}"
                      f" but sits in {directory.name}/"
                  )
                  failed = True

              skill = skill_path.read_text(encoding="utf-8")
              if not skill.startswith("---"):
                  print(f"::error::{skill_path} has no frontmatter")
                  failed = True
              frontmatter = skill.split("---", 2)[1] if skill.count("---") >= 2 else ""
              if "description:" not in frontmatter:
                  print(
                      f"::error::{skill_path} has no frontmatter description —"
                      " ClawHub shows and searches that line"
                  )
                  failed = True
              print(f"  {directory.name}: {manifest['version']} ok")

          sys.exit(1 if failed else 0)
          PY

      # A tag that disagrees with its manifest would publish a version nobody
      # asked for, and a tag naming a Skill that does not exist would publish
      # nothing while looking like it worked.
      - name: The tag names a real Skill, at the version its manifest declares
        if: startsWith(github.ref, 'refs/tags/clawhub-')
        run: |
          python3 - "${GITHUB_REF_NAME}" <<'PY'
          import json, pathlib, re, sys

          match = re.fullmatch(r"clawhub-(.+)-v(\d+\.\d+\.\d+)", sys.argv[1])
          if not match:
              print(f"::error::{sys.argv[1]} is not clawhub-<skill>-v<version>")
              sys.exit(1)
          skill, tagged = match.group(1), match.group(2)

          manifest_path = pathlib.Path("skills")/skill/"clawhub.json"
          if not manifest_path.exists():
              have = sorted(p.name for p in pathlib.Path("skills").iterdir() if p.is_dir())
              print(f"::error::there is no skills/{skill}/ — this repo has {have}")
              sys.exit(1)

          declared = json.loads(manifest_path.read_text(encoding="utf-8"))["version"]
          print(f"  tag:      {tagged}\n  manifest: {declared}")
          if declared != tagged:
              print(f"::error::{manifest_path} is at {declared}, but the tag says {tagged}.")
              sys.exit(1)
          print(f"✅ {skill} {tagged}")
          PY

      # Both sides describe the same protocol. If one grows a composition
      # strategy or a fidelity level the other does not have, a reader gets a
      # different answer depending on which door they came in.
      - name: The bundle's router and these manuals agree on the facts
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          def strategies(text):
              return set(re.findall(r"\b(Seq|Par|Cond|TryPool|Try)\b", text))

          def fidelity(text):
              return set(re.findall(r"\b(Native|Hybrid|Wrapped)\b", text))

          router = pathlib.Path(
              "plugin-source/content/root/assistant/SKILL.md"
          ).read_text(encoding="utf-8")
          manuals = "\n".join(
              path.read_text(encoding="utf-8") for path in sorted(pathlib.Path("skills").glob("*/SKILL.md"))
          )

          failed = False
          for label, extract in (("composition strategies", strategies), ("fidelity levels", fidelity)):
              only_router = extract(router) - extract(manuals)
              only_manuals = extract(manuals) - extract(router)
              if only_router:
                  print(f"::error::the router names {label} the manuals do not: {sorted(only_router)}")
                  failed = True
              if only_manuals:
                  print(f"::error::the manuals name {label} the router does not: {sorted(only_manuals)}")
                  failed = True
              if not (only_router or only_manuals):
                  print(f"  {label}: {sorted(extract(router))}")


      # The index has already miscounted once — four directories under a line
      # reading "three separate listings" — so the count is asserted, not
      # trusted to prose.
      - name: The index counts what the directory holds
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          dirs = sorted(d.name for d in pathlib.Path("skills").iterdir() if d.is_dir())
          readme = pathlib.Path("skills/README.md").read_text(encoding="utf-8")
          # `rotifer-[a-z-]+` missed the bare `rotifer` row the day the entry
          # point took that slug: the pattern assumed every Skill carries a
          # suffix. Match the directory names this index is checked against.
          rows = re.findall(r"^\| \[?`?(rotifer(?:-[a-z-]+)?)`?\]?", readme, re.M)

          missing = [d for d in dirs if d not in rows]
          ghost = [r for r in rows if r not in dirs]
          if missing:
              print(f"::error::skills/README.md has no row for: {missing}")
          if ghost:
              print(f"::error::skills/README.md lists directories that do not exist: {ghost}")
          print(f"  {len(dirs)} directories, {len(rows)} rows")
          sys.exit(1 if (missing or ghost) else 0)
          PY

      # These gates follow the mcp_server field, not a skill's name. A Skill
      # that launches a runtime pins it, says the version everywhere it repeats
      # it, and warns before anything it does to the user's machine — whichever
      # directory it lives in. Keying on a name is how a fifth Skill with the
      # field would arrive ungated; keying on the field means it cannot.
      - name: Gates that travel with the mcp_server field
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          PIN = re.compile(r"@rotifer/mcp-server@(\d+\.\d+\.\d+)")
          failed = False

          bound = []
          for directory in sorted(pathlib.Path("skills").iterdir()):
              if directory.is_dir() and json.loads((directory/"clawhub.json").read_text(encoding="utf-8")).get("mcp_server"):
                  bound.append(directory)

          # The gate must never pass by matching nothing: today one Skill
          # carries the field, and a refactor that dropped it from every
          # manifest would silently disarm everything below.
          if not bound:
              print("::error::no skill declares mcp_server — these gates matched nothing, which is not a pass")
              sys.exit(1)

          # 1. Every pin in the repository agrees. The scan covers the bound
          #    Skills, the plugin bundle, and mcp.json — the file that sat
          #    eight minors behind everything else with no gate watching.
          pins = {}
          for path in pathlib.Path(".").rglob("*"):
              if path.suffix not in (".md", ".json") or not path.is_file():
                  continue
              s = str(path)
              if "node_modules" in s or "package-lock" in s or path.name == "CHANGELOG.md":
                  continue
              for m in PIN.finditer(path.read_text(encoding="utf-8", errors="replace")):
                  pins.setdefault(m.group(1), []).append(s)
          if len(pins) > 1:
              for version, places in sorted(pins.items()):
                  print(f"::error::@rotifer/mcp-server@{version} in: {sorted(set(places))[:6]}")
              failed = True
          else:
              (version, places), = pins.items()
              print(f"  pin {version} agrees across {len(set(places))} files")

          for directory in bound:
              skill = (directory/"SKILL.md").read_text(encoding="utf-8")
              manifest = json.loads((directory/"clawhub.json").read_text(encoding="utf-8"))

              # 2. The SKILL.md frontmatter version and the manifest agree —
              #    2.3.1 shipped disagreeing because both were bumped by hand.
              fm = re.search(r'version:\s*"([^"]+)"', skill.split("---", 2)[1])
              if not fm or fm.group(1) != manifest["version"]:
                  print(f"::error::{directory.name}: SKILL.md says {fm.group(1) if fm else 'nothing'}, manifest says {manifest['version']}")
                  failed = True

              # 3. The launch line is literally the plugin bundle's launch
              #    line. The two spent months in different repositories
              #    drifting in form (npx vs npx -y) while the pins happened to
              #    match; same repo, same line, asserted.
              plugin = pathlib.Path("plugin-source/content/root/evolve/SKILL.md").read_text(encoding="utf-8")
              skill_lines = {l.strip() for l in skill.splitlines() if "--tools=" in l and "npx" in l}
              plugin_lines = {l.strip() for l in plugin.splitlines() if "--tools=" in l and "npx" in l}
              # A launch line is a line that IS the command — prose that
              # quotes the command mid-sentence is compared by what it quotes,
              # which the pin check above already covers.
              bare = {l for l in skill_lines if l.startswith("npx")}
              if not bare:
                  print(f"::error::{directory.name}: no launch line found in SKILL.md")
                  failed = True
              elif not bare <= plugin_lines:
                  print(f"::error::{directory.name}: launch line differs from the plugin bundle's: {sorted(bare - plugin_lines)}")
                  failed = True

              # 4. Disclosure parity: every surface that offers to change the
              #    user's machine also says the user confirms it first.
              readme = (directory/"README.md").read_text(encoding="utf-8")
              for label, text in (("SKILL.md", skill), ("README.md", readme)):
                  if re.search(r"replace|swap|install", text, re.I) and not re.search(r"approval|confirm|approved", text, re.I):
                      print(f"::error::{directory.name}/{label} offers replacements without saying the user confirms them")
                      failed = True

          print(f"  gated: {[d.name for d in bound]}")
          sys.exit(1 if failed else 0)
          PY

  publish:
    name: Publish
    needs: manifest-consistency
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: [rotifer, rotifer-agent, rotifer-arena, rotifer-gene, rotifer-self-evolving-agent]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      # A pull request exercises every Skill under --dry-run, so the publish
      # command is tested on every change. A tag or a dispatch targets one.
      - name: Decide what this leg does
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TARGET="$(python3 -c "import re,sys;print(re.fullmatch(r'clawhub-(.+)-v[0-9.]+', sys.argv[1]).group(1))" "${GITHUB_REF_NAME}")"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.skill }}"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            TARGET="${{ matrix.skill }}"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$TARGET" = "${{ matrix.skill }}" ]; then
            echo "  this leg handles ${{ matrix.skill }}"
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "  $TARGET was asked for, not ${{ matrix.skill }} — nothing to do here"
            echo "selected=false" >> "$GITHUB_OUTPUT"
          fi
          MANIFEST="skills/${{ matrix.skill }}/clawhub.json"
          echo "version=$(python3 -c "import json;print(json.load(open('$MANIFEST'))['version'])")" >> "$GITHUB_OUTPUT"
          # Without --name the CLI falls back to the slug and the listing loses
          # its display name.
          echo "display_name=$(python3 -c "import json;print(json.load(open('$MANIFEST'))['display_name'])")" >> "$GITHUB_OUTPUT"

      # Fail loudly rather than skipping: a real publish that silently does
      # nothing looks identical to a successful one in the run summary.
      - name: Require a token for a real publish
        if: steps.mode.outputs.dry_run == 'false'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::CLAWHUB_TOKEN is not configured, so this publish would do nothing."
            exit 1
          fi
          echo "✅ token present"

      # The CLI does not read a token from the environment — it reads the config
      # file `clawhub login` writes. Passing CLAWHUB_TOKEN to `publish` alone
      # gets "Not logged in".
      - name: Log in
        if: steps.mode.outputs.dry_run == 'false'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: npx --yes clawhub@0.23.3 login --token "$CLAWHUB_TOKEN" --no-browser

      - name: Publish ${{ matrix.skill }}
        if: steps.mode.outputs.selected == 'true'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          ARGS=(
            publish "skills/${{ matrix.skill }}"
            --slug "${{ matrix.skill }}"
            --name "${{ steps.mode.outputs.display_name }}"
            --version "${{ steps.mode.outputs.version }}"
            --tags latest
            --no-input
            --json
            --source-repo "${{ github.repository }}"
            --source-commit "${{ github.sha }}"
            --source-ref "${{ github.ref }}"
          )
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
            echo "Dry run — nothing will be published."
          fi
          npx --yes clawhub@0.23.3 "${ARGS[@]}"
