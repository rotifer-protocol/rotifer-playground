name: ClawHub Live

# `wrap --from-clawhub` against the real ClawHub, once a day.
#
# The PR gate runs the same CLI path against a recorded ClawHub
# (tests/e2e/clawhub-wrap.test.ts): ClawHub's backend fails about one request
# in six with HTTP 500 and takes 4–11 s when it works (measured 2026-10-31),
# so a live call in every PR failed PRs for reasons no PR could fix. This job
# is what notices when the real service changes — a new redirect, a new
# response shape, a moved host — or stays down, and it says so in one
# standing issue rather than in a red PR.
#
# The CLI retries transient failures (3 attempts) and prints what ClawHub
# answered, so the issue carries the real status, e.g.
# "HTTP 500 — [Request ID: …] Server Error (3 attempts)".

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    name: wrap --from-clawhub against clawhub.ai
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Live check
        id: live
        run: |
          set -o pipefail
          if npm run test:live 2>&1 | tee live.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::ClawHub live check failed — see the issue this job opens or refreshes"
          fi

      # One standing issue, refreshed in place: a daily duplicate while
      # ClawHub is down would train everyone to ignore it.
      - name: Open or refresh the ClawHub issue
        if: steps.live.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="ClawHub live check is failing"
          # The CLI's own error lines: they name the HTTP status or the
          # timeout / network cause.
          grep -E "error\[E00(10|11|12)\]|ClawHub:|AssertionError|FAIL " live.log | head -20 > excerpt.txt || true
          {
            echo "\`npm run test:live\` (tests/live/clawhub-live.test.ts) failed against the real ClawHub."
            echo
            echo "What the CLI reported:"
            echo
            echo '```'
            cat excerpt.txt
            echo '```'
            echo
            echo "Run: $RUN_URL"
            echo
            echo "If ClawHub changed shape (fields, redirects, host), update src/utils/clawhub-client.ts and the recorded fixture in tests/fixtures/clawhub/. If it is only down or answering 5xx, this issue is refreshed daily until a run passes; close it then."
            echo
            echo "Refreshed automatically by \`.github/workflows/clawhub-live.yml\`."
          } > issue-body.md
          EXISTING="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            {
              echo "Still failing ($(date -u +%F)): $RUN_URL"
              echo
              echo '```'
              cat excerpt.txt
              echo '```'
            } > comment.md
            gh issue comment "$EXISTING" --body-file comment.md
            echo "refreshed issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi
          exit 1
