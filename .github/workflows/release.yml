name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Pre-release Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Rust/npm version alignment
        run: npm run verify:versions

      - name: Check generated plugin outputs
        run: npm run check:plugins

      - name: Verify plugin packaging references
        run: npm run verify:plugins

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  cross-platform:
    name: Cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify CLI
        run: node dist/index.js --version

  native-build:
    name: Build Native Addons
    needs: validate
    uses: ./.github/workflows/napi-build.yml
    with:
      upload: true

  rust-test:
    name: Rust Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Test core
        run: cargo test -p rotifer-core

  publish-native:
    name: Publish Native Packages
    runs-on: ubuntu-latest
    needs: [cross-platform, native-build, rust-test]
    environment: npm
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        pkg: [darwin-arm64, darwin-x64, linux-x64-gnu, win32-x64-msvc]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Resolve release version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ]; then
            echo "Release version is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: native-${{ matrix.pkg }}
          path: npm/${{ matrix.pkg }}/

      - name: Ensure package version matches release version
        working-directory: npm/${{ matrix.pkg }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json version ($PKG_VERSION) does not match release version (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi

      - name: Check whether platform package already exists on npm
        id: npm_check
        working-directory: npm/${{ matrix.pkg }}
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          if npm view "${PKG_NAME}@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish platform package
        if: steps.npm_check.outputs.already_published != 'true'
        working-directory: npm/${{ matrix.pkg }}
        run: npm publish --access public --provenance

  publish:
    name: Publish Main Package
    runs-on: ubuntu-latest
    needs: [publish-native]
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Resolve release version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ]; then
            echo "Release version is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (sync lock to the platform packages published above)
        run: |
          # release-please bumps the platform optionalDependencies but cannot
          # regenerate package-lock.json (the resolved/integrity fields need the
          # published package). publish-native just published them, so sync the lock
          # first — otherwise the strict `npm ci` rejects it ("lock's X@old does not
          # satisfy X@new"). The sync-lock job below re-points main's committed lock.
          npm install --package-lock-only
          npm ci

      - name: Build
        run: npm run build

      - name: Ensure package version matches release version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json version ($PKG_VERSION) does not match release version (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi

      - name: Check whether main package already exists on npm
        id: npm_check
        run: |
          if npm view "@rotifer/playground@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.npm_check.outputs.already_published != 'true'
        run: npm publish --access public --provenance

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          name: "Rotifer Playground v${{ steps.version.outputs.version }}"
          body: |
            ## Rotifer Playground v${{ steps.version.outputs.version }}

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ### Install
            ```bash
            npm install -g @rotifer/playground@${{ steps.version.outputs.version }}
            ```

            ### Quick Start
            ```bash
            rotifer init my-agent && cd my-agent
            rotifer hello --template quality-advisor
            ```
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') }}

  sync-lock:
    # After a release, main's package-lock.json still pins the platform packages at
    # the PREVIOUS version: release-please bumps package.json's optionalDependencies
    # but cannot regenerate the lock (the resolved/integrity fields need the
    # published package). Now that the new platform packages are published (above),
    # regenerate the lock and open a PR so `npm ci` on main + every later PR stays
    # green. Direct push to main is gated by the DCO required check and auto-merge is
    # disabled, so this goes through a PR for a maintainer to merge.
    name: Sync package-lock to released versions
    runs-on: ubuntu-latest
    needs: [publish]
    # Long enough to wait out a full CI cycle on the sync PR (the required set
    # runs in about three minutes) without a stuck watch holding a runner all day.
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Resolve release version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Sync package-lock to the now-published platform packages
        run: npm install --package-lock-only

      - name: Open a sync PR if the lock changed
        id: sync
        env:
          # Must be the PAT, not GITHUB_TOKEN: this org disables "Allow GitHub
          # Actions to create and approve pull requests", so GITHUB_TOKEN gets
          # "GitHub Actions is not permitted to create or approve pull requests"
          # and no PR appears. release-please uses the same PAT to open its
          # release PRs, which is the proof it carries the needed scope.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync with the released versions — nothing to do."
            exit 0
          fi
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="chore/sync-lock-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package-lock.json
          git commit -s -m "chore(release): sync package-lock.json to v${VERSION}"
          git push --force origin "$BRANCH"

          # Only an "already exists" failure is benign. Everything else — a
          # permissions refusal above all — must fail the job. A blanket
          # `|| echo "already exists"` previously swallowed the refusal and
          # reported success, so the lock drifted unnoticed through two
          # releases (v0.9.0 and v0.10.0) and broke `npm ci` on main both times.
          if ! ERR=$(gh pr create \
            --base main --head "$BRANCH" \
            --title "chore(release): sync package-lock.json to v${VERSION}" \
            --body "release-please bumped the platform optionalDependencies to v${VERSION} but cannot regenerate package-lock.json (the resolved/integrity fields need the published package). The platform packages are now published, so this re-points the lock to match. Merge to keep npm ci green on main and every subsequent PR." 2>&1); then
            if printf '%s' "$ERR" | grep -qi "already exists"; then
              echo "A sync-lock PR for v${VERSION} already exists; the branch was updated."
            else
              echo "::error::Could not open the package-lock sync PR: ${ERR}"
              echo "Branch ${BRANCH} is pushed — open the PR manually to unblock npm ci on main."
              exit 1
            fi
          fi

          PR="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -z "$PR" ]; then
            echo "::error::${BRANCH} is pushed but no open PR resolves against it — open and merge one by hand."
            exit 1
          fi
          echo "pr=${PR}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      # Opening the PR was never the missing piece — merging it was. main's
      # `npm ci` stays broken for every contributor until this lands, and the
      # wait has been 17 minutes (v0.18.0), 13 hours (v0.15.0), and never at all
      # for v0.10.2, v0.11.0 and v0.14.0, whose sync PRs were closed unmerged and
      # repaired by hand afterwards. Nobody reviews a regenerated lockfile line by
      # line, so the wait buys nothing that the checks do not already buy.
      #
      # This is not a bypass. It waits for exactly the checks branch protection
      # requires and merges through the ordinary path; one red check stops it and
      # fails this job loudly. Never add --admin here.
      - name: Merge the sync PR once its required checks pass
        if: steps.sync.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.sync.outputs.pr }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # `gh pr checks --required` lists only the checks that have already
          # REPORTED. A required job still queued behind its `needs:` has no check
          # run yet — `Build` sits behind eight of them — so an early --watch can
          # exit 0 with the gate half empty, the merge then bounces off branch
          # protection, and this job fails for what was only ever a race. Ask the
          # API which contexts are required and wait for each of those names.
          REQUIRED="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection/required_status_checks" --jq '.contexts[]' 2>/dev/null || true)"
          if [ -z "$REQUIRED" ]; then
            # Reading branch protection needs an administration:read scope this
            # token may not carry. GitHub's own verdict is the fallback: CLEAN
            # means every required check reported and passed.
            echo "::warning::Could not read the required-check list — waiting on mergeStateStatus instead. A red required check will surface as a timeout rather than by name."
          fi

          DEADLINE=$(( $(date +%s) + 1800 ))
          while :; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Timed out waiting for #${PR} to become mergeable. main's package-lock is still missing the v${VERSION} platform entries, and npm ci fails on every PR until #${PR} merges — merge it by hand."
              exit 1
            fi

            CHECKS="$(gh pr checks "$PR" --json name,bucket 2>/dev/null || echo '[]')"

            if [ -n "$REQUIRED" ]; then
              FAILED="$(printf '%s' "$CHECKS" | jq -r --arg req "$REQUIRED" '
                ($req | split("\n") | map(select(length > 0))) as $names
                | map(select((.name as $n | $names | index($n)) and (.bucket == "fail" or .bucket == "cancel")))
                | map(.name) | join(", ")')"
              if [ -n "$FAILED" ]; then
                echo "::error::Required checks failed on #${PR}: ${FAILED}. main's package-lock is still missing the v${VERSION} platform entries, and npm ci fails on every PR until #${PR} merges."
                exit 1
              fi

              # A red NON-required check is deliberately ignored: branch protection
              # does not gate on it, so neither does the repair.
              MISSING="$(printf '%s' "$CHECKS" | jq -r --arg req "$REQUIRED" '
                . as $checks
                | ($req | split("\n") | map(select(length > 0)))
                | map(select(. as $n | ($checks | map(select(.name == $n and .bucket == "pass")) | length) == 0))
                | join(", ")')"
              if [ -z "$MISSING" ]; then break; fi
              echo "Waiting on required checks for #${PR}: ${MISSING}"
            else
              STATE="$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus 2>/dev/null || echo UNKNOWN)"
              if [ "$STATE" = "CLEAN" ]; then break; fi
              echo "Waiting for #${PR} to become mergeable (state ${STATE})."
            fi

            sleep 15
          done

          if ! ERR=$(gh pr merge "$PR" --squash 2>&1); then
            if printf '%s' "$ERR" | grep -qiE "not open|already merged"; then
              echo "#${PR} was merged already — nothing to do."
            else
              echo "::error::Could not merge #${PR}: ${ERR}"
              exit 1
            fi
          fi

          # Tidying only. It must never decide whether this job passed.
          git push origin --delete "$BRANCH" || true

      # "The PR merged" and "main installs again" are different claims, and only
      # the second one is the reason this job exists. Check that one.
      - name: Verify main's lockfile now resolves the released platform packages
        if: steps.sync.outputs.pr != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # FETCH_HEAD rather than origin/main: fetch always writes it, whereas
          # the remote-tracking ref depends on the refspec checkout happened to
          # configure. Retry briefly — the merge commit can take a moment to be
          # visible on a fetch, and a false red here would be a red release.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git show FETCH_HEAD:package-lock.json > /tmp/main-lock.json
            if node -e 'const l=require("/tmp/main-lock.json");process.exit(Object.keys(l.packages).some((k)=>k.startsWith("node_modules/@rotifer/playground-"))?0:1)'; then
              break
            fi
            echo "main does not show the merged lock yet (attempt ${attempt}) — refetching."
            sleep 5
          done
          node -e '
            const lock = require("/tmp/main-lock.json");
            const version = process.env.VERSION;
            const wanted = Object.keys(lock.packages[""].optionalDependencies || {})
              .filter((name) => name.startsWith("@rotifer/playground-"));
            if (wanted.length === 0) {
              console.log("::error::package.json lists no @rotifer/playground-* platform packages — this check is looking at the wrong thing.");
              process.exit(1);
            }
            const missing = wanted.filter((name) => {
              const entry = lock.packages["node_modules/" + name];
              return !entry || entry.version !== version || !entry.integrity;
            });
            if (missing.length > 0) {
              console.log("::error::main package-lock.json still has no resolvable v" + version + " entry for: " + missing.join(", "));
              process.exit(1);
            }
            console.log("\u2713 main package-lock.json resolves all " + wanted.length + " platform packages at v" + version);
          '
