[package]
name = "rotifer-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "napi-rs bridge — exposes Rust Core to the TS CLI via PlaygroundBinding facade"

[lib]
crate-type = ["cdylib"]

[dependencies]
rotifer-core = { version = "0.16.0", path = "../rotifer-core" } # x-release-please-version
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
uuid.workspace = true

[build-dependencies]
napi-build = "2"
