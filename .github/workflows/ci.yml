name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # release-please bumps dependency versions through `extra-files`, which are raw
  # text edits that never reach the lockfiles. The result is a tree where
  # package.json asks for 0.10.2 while package-lock.json still pins 0.10.1, and
  # `npm ci` refuses to install — a break that has now shipped to main twice
  # (v0.10.1 fixed it by hand, v0.10.2 reintroduced it). release-please.yml now
  # regenerates the lockfiles on the release branch; this job is the backstop
  # that keeps the drift from reaching main by any other route.
  lockfile-sync:
    name: Lockfile Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Regenerate lockfiles from the manifests
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo metadata --format-version 1 > /dev/null

      - name: Lockfiles must already match the manifests
        run: |
          if git diff --quiet -- package-lock.json Cargo.lock; then
            echo "✓ package-lock.json 与 Cargo.lock 均与 manifest 一致"
            exit 0
          fi

          # One drift has a different cause and a different fix. In the window
          # between a release landing on main and its post-publish lock repair,
          # package.json asks for platform packages the lock does not carry —
          # npm could not resolve them before they were published. Every open PR
          # inherits that through its merge ref, so the failure looks like the
          # contributor's and the generic advice below is actively wrong for it:
          # regenerating locally would drag a release fix into their branch.
          ONLY_PLATFORM="$(node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const head = JSON.parse(execSync("git show HEAD:package-lock.json", { encoding: "utf8", maxBuffer: 128 * 1024 * 1024 }));
            const now = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const paths = new Set([...Object.keys(head.packages), ...Object.keys(now.packages)]);
            const changed = [...paths].filter((path) => JSON.stringify(head.packages[path]) !== JSON.stringify(now.packages[path]));
            const isPlatform = (path) => path.startsWith("node_modules/@rotifer/playground-");
            console.log(changed.length > 0 && changed.every(isPlatform) ? "yes" : "no");
          ')"

          if [ "$ONLY_PLATFORM" = "yes" ] && git diff --quiet -- Cargo.lock; then
            # English, unlike the generic message below: this one is addressed to
            # whoever just watched their PR go red for someone else's reason, and
            # this repo takes contributions from outside.
            echo "::error::This is not your change. main was released moments ago and package-lock.json carries no entries for the @rotifer/playground-* platform packages yet — npm cannot resolve a version that is not published, and drops the entries instead of failing. The release pipeline opens and merges a 'chore(release): sync package-lock.json to vX.Y.Z' PR that restores them; re-run this check once it lands. Do NOT regenerate the lockfile locally and commit it — that pulls a release fix into your branch."
            git --no-pager diff --stat -- package-lock.json
            exit 1
          fi

          echo "::error::锁文件与 manifest 不一致。本地跑 'npm install --package-lock-only --ignore-scripts' 和 'cargo metadata' 后提交结果。"
          git --no-pager diff --stat -- package-lock.json Cargo.lock
          git --no-pager diff -- package-lock.json Cargo.lock
          exit 1

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Rust/npm version alignment
        run: npm run verify:versions

      - name: TypeScript type check
        run: npm run lint

  plugin-source:
    name: Plugin Source Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check generated plugin outputs
        run: npm run check:plugins

      - name: Verify plugin packaging references
        run: npm run verify:plugins

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        # Node floor is 22.18 (#269/#270): genes are TypeScript and the CLI
        # imports them from source, which needs built-in type stripping. A
        # Node 20 job can only ever exercise the .js fixtures, so it guards
        # nothing the 22 job does not.
        node-version: ["22"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # The coverage gate (60/55 thresholds in vitest.config.ts) ran on this
      # lane from cdb9d727 until b108617 dropped it as a side effect of the
      # native-addon work. Restored: one canonical lane enforces thresholds,
      # the other lanes stay plain cross-platform test runs.
      - name: Run coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Run cross-platform tests
        if: matrix.os != 'ubuntu-latest'
        run: npm test

  deno-functions:
    name: Edge Function Tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x
      # Self-contained pure-logic tests for the chat edge function: RAG
      # ranking plus upstream-stream completion handling. Collect the whole
      # directory so a new .test.ts cannot be written without being run.
      # --allow-read is scoped to the function dir: the wiring guard reads
      # index.ts as text to assert the cache call stays behind its gate.
      - name: Run chat edge function tests
        run: deno test --allow-read=supabase/functions/chat supabase/functions/chat/

  vscode-extension:
    name: VSCode Extension Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install extension dependencies
        working-directory: rotifer-vscode
        run: npm ci

      - name: Run extension tests
        working-directory: rotifer-vscode
        run: npm test

  vscode-packaging:
    name: VSCode Extension Packaging
    runs-on: ubuntu-latest
    needs: [plugin-source]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        working-directory: rotifer-vscode
        run: npm ci

      - name: Package VSCode extension
        working-directory: rotifer-vscode
        run: |
          mkdir -p ../artifacts
          npx --yes @vscode/vsce package --out ../artifacts/rotifer-vscode-ci.vsix

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, plugin-source, test, deno-functions, rust-check, security-check, vscode-extension, vscode-packaging, supabase-migrations]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          node dist/index.js --version

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Cargo check (all crates)
        run: cargo check --workspace

      - name: Cargo test (core)
        run: cargo test -p rotifer-core

      - name: Build napi bridge (verify compilation)
        run: |
          npm install -g @napi-rs/cli
          cd crates/rotifer-napi && napi build --release --platform

      - name: Cargo clippy (all crates)
        run: cargo clippy --workspace -- -D warnings

  p2p-integration:
    name: P2P Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Two-node libp2p integration tests (serial, real loopback nodes)
        # The src/p2p/ two-node tests (kad discovery / gossipsub broadcast / DHT
        # put-get + the connectivity spike) are
        # #[cfg_attr(not(feature = "p2p-integration"), ignore)] — ignored by the
        # default `cargo test`. Enable the feature to run them, single-threaded:
        # they spin up real libp2p nodes on loopback and share fixed identity
        # files, so parallel execution would contend. The deferred spec-ID
        # scaffolds (A_1_6 mDNS / A_4_3 / A_4_4 / A_6_6) stay unconditionally
        # #[ignore]d and never run here.
        run: cargo test -p rotifer-core --features p2p-integration --lib -- --test-threads=1

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    needs: [rust-check, test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cargo dependency audit
        run: |
          # cargo-audit 0.22+ is required to parse current RustSec CVSS 4.0 advisories.
          cargo install cargo-audit@0.22.1 --quiet
          # RUSTSEC-2026-0118 / -0119: hickory-proto DoS, reachable only via libp2p's
          # optional dns/mdns features, which we do NOT enable — the DNS code is never
          # compiled into the binary (it only lingers in Cargo.lock as a disabled
          # optional dependency). -0118 has no fixed release. Tracked: move to libp2p
          # component crates to drop it from the lockfile entirely.
          # NOTE: the wasmtime ignore (RUSTSEC-2026-0114) is gone — wasmtime is now on
          # 47.0.3, which fixes both -0114 and -0222. Do not re-add an ignore for the
          # WASM sandbox: upgrade instead, since it is the Gene isolation boundary.
          cargo audit --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119

      - name: npm dependency audit
        run: npm audit --audit-level=high

      - name: WASM sandbox security tests
        run: cargo test -p rotifer-core --test wasm_security

      - name: Full Rust test suite (regression check)
        run: cargo test -p rotifer-core

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Self-scan (V(g) security)
        run: |
          npm run build
          node dist/index.js vg . --json

      - name: Scan for cross-contamination
        run: |
          echo "Scanning full commit history for private file paths..."
          CONTAMINATED=$(git log --all --diff-filter=A --name-only --format="" | grep "^internal/" | sort -u || true)
          if [ -n "$CONTAMINATED" ]; then
            echo "::error::⛔ CRITICAL: private files found in commit history!"
            echo "$CONTAMINATED"
            echo "This public repo must NEVER contain private files."
            exit 1
          else
            echo "✅ No contamination detected"
          fi

      - name: Report security scan to Observatory
        if: github.ref == 'refs/heads/main' && env.QUALITY_SUPABASE_URL != ''
        env:
          QUALITY_SUPABASE_URL: ${{ secrets.QUALITY_SUPABASE_URL }}
          QUALITY_SUPABASE_KEY: ${{ secrets.QUALITY_SUPABASE_SERVICE_KEY }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # `npm audit` exits non-zero when vulnerabilities exist; `|| echo '{}'`
          # would append '{}' to the real JSON and break JSON.parse (all counts → 0).
          NPM_AUDIT=$(npm audit --json --registry https://registry.npmjs.org/ 2>/dev/null || true)
          [ -z "$NPM_AUDIT" ] && NPM_AUDIT='{}'
          CRITICAL=$(echo "$NPM_AUDIT" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).metadata?.vulnerabilities?.critical||0}catch{0}")
          HIGH=$(echo "$NPM_AUDIT" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).metadata?.vulnerabilities?.high||0}catch{0}")
          MODERATE=$(echo "$NPM_AUDIT" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).metadata?.vulnerabilities?.moderate||0}catch{0}")
          LOW=$(echo "$NPM_AUDIT" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).metadata?.vulnerabilities?.low||0}catch{0}")
          TOTAL=$(echo "$NPM_AUDIT" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).metadata?.dependencies?.total||0}catch{0}")

          GRADE="PASS"
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then GRADE="FAIL"; fi
          # Extract per-advisory detail so the dashboard can show which
          # vulnerabilities exist, not just the counts. Emits a JSON array
          # (already properly escaped by JSON.stringify) injected verbatim.
          FINDINGS=$(echo "$NPM_AUDIT" | node -e 'let a; try { a = JSON.parse(require("fs").readFileSync("/dev/stdin","utf8")); } catch { process.stdout.write("[]"); process.exit(0); } const out=[]; const rank={critical:0,high:1,moderate:2,low:3}; for (const [name,v] of Object.entries(a.vulnerabilities||{})) { const advs=(v.via||[]).filter((x)=>typeof x==="object"); if (advs.length===0){ out.push({package:name,severity:v.severity,title:"Depends on a vulnerable dependency",url:"",range:v.range||""}); } else { for (const ad of advs){ out.push({package:name,severity:ad.severity||v.severity,title:ad.title||"",url:ad.url||"",range:v.range||""}); } } } out.sort((p,q)=>(rank[p.severity]??9)-(rank[q.severity]??9)); process.stdout.write(JSON.stringify(out.slice(0,50)));')
          [ -z "$FINDINGS" ] && FINDINGS='[]'

          if curl --fail-with-body -sS -X POST "${QUALITY_SUPABASE_URL}/rest/v1/security_scan_results" \
            -H "apikey: ${QUALITY_SUPABASE_KEY}" \
            -H "Authorization: Bearer ${QUALITY_SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"version\":\"v${VERSION}\",\"component\":\"cli\",\"scan_type\":\"npm_audit\",\"grade\":\"${GRADE}\",\"severity_counts\":{\"critical\":${CRITICAL},\"high\":${HIGH},\"moderate\":${MODERATE},\"low\":${LOW}},\"findings\":${FINDINGS},\"source\":\"ci\",\"ci_run_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"; then
            echo "✅ Security scan reported"
          else
            echo "::warning::Security scan report upload failed"
          fi

          curl -s -X POST "${QUALITY_SUPABASE_URL}/rest/v1/dependency_audit_logs" \
            -H "apikey: ${QUALITY_SUPABASE_KEY}" \
            -H "Authorization: Bearer ${QUALITY_SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"component\":\"cli\",\"audit_tool\":\"npm_audit\",\"total_deps\":${TOTAL},\"vulnerabilities\":{\"critical\":${CRITICAL},\"high\":${HIGH},\"moderate\":${MODERATE},\"low\":${LOW}},\"ci_run_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            && echo "✅ Dependency audit reported" || echo "⚠️ Report failed (non-blocking)"

  supabase-migrations:
    name: Supabase Migration Replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: supabase/setup-cli@b579fc8c7122aa485f1d947120eaeb11ee04d312 # v2.0.0
        with:
          version: 2.67.1

      - name: Verify migration chain replays cleanly
        # `supabase start` internally runs `db reset` which applies every
        # migration in supabase/migrations/ from scratch. A clean exit
        # proves dev/prod parity (no SQLSTATE 42P13 return-type drift,
        # missing extensions, etc). Source: v0.8.8 dev/prod parity sprint
        # (rotifer-playground commit 9d8076b + this sprint).
        run: supabase start

      - name: Run pgTAP test suite
        run: |
          # B-R6 sprint (2026-05-17) closed every known v0.9 stage-2 failure:
          #   - plan() count corrected to 57 (B.1=11, B.2=9, B.3=9,
          #     B.4=7, B.5=6, B.6=7, B.7=5, B.8=3); now 60, B.6=10 since
          #     ADR-319 item 1.7 gave §33.4 a real fixture
          #   - B.2.1 uses SAVEPOINT to mark every season ended,
          #     exercise the no-active-season branch, then ROLLBACK so
          #     B.2.2 happy path still sees an active season
          #   - B.2.8 / B.7.5 anon EXECUTE drop closed by hardening
          #     migration 20260517040000 (REVOKE FROM PUBLIC, not just
          #     anon — Postgres functions default to PUBLIC EXECUTE)
          #   - B.7.2 anon table privs reduced to SELECT-only by the
          #     same hardening migration
          # The suite is now blocking — any drift fails CI.
          supabase test db

      - name: Stop supabase
        if: always()
        run: supabase stop --no-backup || true

  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: Install gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Run gitleaks
        run: |
          "$(go env GOPATH)/bin/gitleaks" git . --config .gitleaks.toml --no-banner --redact

  broken-links:
    name: Broken Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # Self-contained relative-link checker (ADR-294 D3). Skips genes/:
      # published Gene SKILL bundles may reference optional companion assets
      # not shipped in minimal layout — gene link hygiene tracked via gene-audit.
      - name: Check relative markdown links (offline, repo-local only)
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          from urllib.parse import unquote
          INLINE = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          SCHEME = re.compile(r'^[a-zA-Z][a-zA-Z0-9+.-]*:')
          FENCE = re.compile(r'^\s*(```|~~~)')
          SKIP = {'.git', 'node_modules', 'genes'}
          broken, scanned = [], 0
          for md in pathlib.Path('.').rglob('*.md'):
              if any(p in SKIP for p in md.parts):
                  continue
              scanned += 1
              in_fence = False
              for line in md.read_text(encoding='utf-8', errors='replace').splitlines():
                  if FENCE.match(line):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  for m in INLINE.finditer(line):
                      raw = m.group(1).strip()
                      target = (raw.split()[0] if raw else '').split('#', 1)[0]
                      if (not target or target.startswith('#')
                              or target.startswith('/') or SCHEME.match(target)):
                          continue
                      if not (md.parent / unquote(target)).exists():
                          broken.append(f"{md}: {raw}")
          print(f"scanned {scanned} markdown files")
          if broken:
              print("::error::Broken relative links found:")
              for b in broken:
                  print(b)
              sys.exit(1)
          print("✅ No broken relative links")
          PY

  report-quality:
    name: Report to Quality Observatory
    runs-on: ubuntu-latest
    needs: [test, vscode-extension, security-check]
    # always(): telemetry must record red main runs too. Without it, any
    # upstream failure skips this job and the Observatory never sees the
    # failure it exists to observe. The steps themselves stay best-effort
    # (|| true), so a broken upload never blocks the pipeline.
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run tests with JSON reporter + coverage
        run: |
          npm run build
          npx vitest run --reporter=json --outputFile=test-results.json --coverage 2>/dev/null || true

      - name: Report test results to Supabase
        if: env.QUALITY_SUPABASE_URL != ''
        env:
          QUALITY_SUPABASE_URL: ${{ secrets.QUALITY_SUPABASE_URL }}
          QUALITY_SUPABASE_KEY: ${{ secrets.QUALITY_SUPABASE_SERVICE_KEY }}
        run: |
          if [ ! -f test-results.json ]; then
            echo "No test results file found, skipping report"
            exit 0
          fi

          VERSION=$(node -p "require('./package.json').version")
          RELEASE_LINE_VERSION="v${VERSION}"
          TOTAL=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).numTotalTests || 0")
          PASSED=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).numPassedTests || 0")
          FAILED=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).numFailedTests || 0")
          DURATION=$(node -p "Math.round(JSON.parse(require('fs').readFileSync('test-results.json','utf8')).testResults?.reduce((s,r) => s + (r.endTime - r.startTime), 0) || 0)")

          COVERAGE_PCT=0
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total?.lines?.pct || 0")
          fi

          curl -s -X POST "${QUALITY_SUPABASE_URL}/rest/v1/release_test_reports" \
            -H "apikey: ${QUALITY_SUPABASE_KEY}" \
            -H "Authorization: Bearer ${QUALITY_SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"version\": \"v${VERSION}\",
              \"release_line_version\": \"${RELEASE_LINE_VERSION}\",
              \"component\": \"cli\",
              \"test_type\": \"unit\",
              \"total_tests\": ${TOTAL},
              \"passed\": ${PASSED},
              \"failed\": ${FAILED},
              \"duration_ms\": ${DURATION},
              \"coverage_pct\": ${COVERAGE_PCT},
              \"ci_run_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"
            }" && echo "✅ Reported to Quality Observatory (coverage: ${COVERAGE_PCT}%)" || echo "⚠️ Report failed (non-blocking)"

  regression-guard:
    if: github.event_name == 'pull_request'
    name: Regression Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/regression-guard
