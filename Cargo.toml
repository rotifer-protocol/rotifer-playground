[workspace]
members = ["crates/rotifer-core", "crates/rotifer-napi"]
resolver = "2"

[workspace.package]
version = "0.32.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rotifer-protocol/rotifer-playground"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
# Every default feature except `cache`: nothing here uses wasmtime's on-disk
# compilation cache, and that feature alone pulls in zstd (RUSTSEC-2026-0391,
# -0398, -0403, -0410). The rest of the list is wasmtime 48's `default`
# unchanged; re-check it when upgrading wasmtime.
wasmtime = { version = "48.0.7", default-features = false, features = [
    "anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null",
    "wat", "profiling", "parallel-compilation", "cranelift", "pooling-allocator",
    "demangle", "addr2line", "coredump", "debug-builtins", "runtime",
    "component-model", "component-model-async", "threads", "stack-switching",
    "std", "debug", "compile-time-builtins", "wit-parser",
] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
hex = "0.4"
rmp-serde = "1"
# RFC 8785 canonical JSON for gene ID v2 (docs/gene-id-v2.md). ECMAScript number
# formatting is the hard part of JCS; this crate does it via ryu-js.
serde_jcs = "0.2"
# P2P wire format v1 (crates/rotifer-core/proto/p2p-wire-v1.proto), hand-written
# derive types — no build-time protoc. Already in the tree via libp2p-identity.
prost = "0.14"
wasm-encoder = "0.251"
wasmparser = "0.251"
libp2p = { version = "0.56", default-features = false }
base64 = "0.22"
# Hybrid Binding API (ADR-327): synchronous HTTP client for the rotifer.net
# host function. ureq over reqwest on purpose — no tokio entanglement inside
# sync wasmtime host callbacks, small dependency tree (rustls).
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
