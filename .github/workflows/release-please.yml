name: release-please

# git tag is the single source of truth for the version. release-please opens a
# Release PR (bumps root package.json, Cargo.toml workspace version, and the 4
# npm platform packages, and generates CHANGELOG). Merging the PR tags v*, which
# triggers the existing release.yml publish pipeline.
#
# Requires the RELEASE_PLEASE_TOKEN secret (fine-grained PAT, Contents + PR
# read/write): a tag pushed with that PAT triggers release.yml, whereas one
# pushed with the default GITHUB_TOKEN would not (GitHub's recursion guard).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr_branch: ${{ steps.release.outputs.pr && fromJson(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps dependency versions via `extra-files`, which are raw
  # text edits: package.json ends up asking for the new platform packages while
  # package-lock.json still pins the old ones, and `npm ci` then refuses to
  # install. Cargo.lock drifts the same way against the workspace version. Both
  # have reached main before (v0.10.1 was itself the hand-fix; v0.10.2 brought
  # the break straight back), so regenerate them on the release branch instead of
  # repairing them afterwards.
  #
  # Pushing to the release branch triggers nothing: this workflow only runs on
  # push to main.
  sync-lockfiles:
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Regenerate lockfiles from the bumped manifests
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo metadata --format-version 1 > /dev/null

      - name: Commit the lockfiles if they moved
        run: |
          if git diff --quiet -- package-lock.json Cargo.lock; then
            echo "锁文件已与 manifest 一致，无需提交"
            exit 0
          fi
          git --no-pager diff --stat -- package-lock.json Cargo.lock

          # npm cannot write a lockfile entry for a package that is not on the
          # registry yet — and it does not fail when asked to: it drops the entry
          # and exits 0. The four @rotifer/playground-* platform packages are
          # published from the tag this PR creates, so on a release branch they
          # always drop. The hole itself is unavoidable (resolved/integrity need
          # the published tarball); committing it under the word "sync" is not.
          # Name it, so `git log` shows the hole instead of a tidy label.
          DROPPED="$(node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const covered = new Set(Object.keys(lock.packages));
            const wanted = Object.keys(lock.packages[""].optionalDependencies || {})
              .filter((name) => name.startsWith("@rotifer/playground-"));
            console.log(wanted.filter((name) => !covered.has("node_modules/" + name)).join(" "));
          ')"

          git config user.name "rotifer-release-bot"
          git config user.email "dev@rotifer.dev"
          git add package-lock.json Cargo.lock
          # -s keeps the release PR passing the DCO gate.
          if [ -n "$DROPPED" ]; then
            echo "::warning::npm dropped the lockfile entries for ${DROPPED} — those versions are not published yet. Merging this PR leaves npm ci broken on main until release.yml's sync-lock job restores them after publish."
            git commit -s \
              -m "chore: sync lockfiles with the bumped manifests" \
              -m "The @rotifer/playground-* entries are dropped rather than bumped: npm cannot record resolved/integrity for a version that is not published yet, and those packages are published from the tag this PR creates. release.yml's sync-lock job restores them once the tag has published, and merges that repair itself."
          else
            git commit -s -m "chore: sync lockfiles with the bumped manifests"
          fi
          git push
