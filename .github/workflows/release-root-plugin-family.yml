name: Release Root Plugin Family

# The root plugin family ships to Cursor and CodeBuddy from this repository and
# its manifests, and to ClawHub as the `rotifer` package. ClawHub is the one
# host that needs a publish call: until this workflow made it, every version
# after 0.9.3 (2026-08-18) stayed in the repository and never reached the
# listing, because nothing in the release path ran `clawhub package publish`.
#
# A `root-plugin-v<version>` tag publishes for real. A pull request that
# touches the plugin runs the same publish command with --dry-run, so it is
# exercised on every change instead of being discovered broken on release day.
on:
  push:
    tags:
      - "root-plugin-v*"
  pull_request:
    branches: [main]
    paths:
      - "plugin-source/**"
      - "plugins/rotifer/**"
      - ".github/workflows/release-root-plugin-family.yml"
  workflow_dispatch:
    inputs:
      clawhub_dry_run:
        description: "ClawHub: preview the package publish without uploading"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate Root Plugin Family
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check root family tag matches manifest
        if: startsWith(github.ref, 'refs/tags/root-plugin-v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/root-plugin-v}"
          CONFIG_VERSION=$(node -p "require('./plugin-source/families.json').root.version")
          if [ "$TAG_VERSION" != "$CONFIG_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match plugin-source/families.json root version $CONFIG_VERSION"
            exit 1
          fi

      - name: Check generated plugin outputs
        run: npm run check:plugins

      - name: Verify plugin packaging references
        run: npm run verify:plugins

  package:
    name: Package Root Plugin Family
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check generated plugin outputs
        run: npm run check:plugins

      - name: Prepare release artifacts
        run: |
          VERSION=$(node -p "require('./plugin-source/families.json').root.version")
          mkdir -p release-artifacts/root-cursor
          cp -R .cursor-plugin release-artifacts/root-cursor/
          mkdir -p release-artifacts/root-cursor/plugins
          cp -R plugins/rotifer release-artifacts/root-cursor/plugins/
          tar -czf "release-artifacts/root-cursor-plugin-${VERSION}.tar.gz" -C release-artifacts/root-cursor .
          mkdir -p release-artifacts/root-codebuddy
          cp -R .codebuddy-plugin release-artifacts/root-codebuddy/
          mkdir -p release-artifacts/root-codebuddy/plugins
          cp -R plugins/rotifer release-artifacts/root-codebuddy/plugins/
          tar -czf "release-artifacts/root-codebuddy-marketplace-${VERSION}.tar.gz" -C release-artifacts/root-codebuddy .

      - uses: actions/upload-artifact@v7
        with:
          name: root-plugin-family
          path: release-artifacts/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/root-plugin-v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          name: "Rotifer Root Plugin Family ${{ github.ref_name }}"
          body: |
            Root plugin family release.

            This release packages the generated Cursor and CodeBuddy plugin surfaces from `plugin-source/`.

            Notes:
            - Cursor distribution remains Git-repository driven.
            - CodeBuddy marketplace distribution remains marketplace-manifest driven.
            - ClawHub (`rotifer` package) is published by this workflow's "Publish to ClawHub" job.
            - These tarballs are release artifacts for review, mirroring, and manual marketplace workflows when needed.
          files: |
            release-artifacts/root-cursor-plugin-*.tar.gz
            release-artifacts/root-codebuddy-marketplace-*.tar.gz

  publish-clawhub:
    name: Publish to ClawHub
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      # The validate job has already checked that a tag matches
      # families.json, so the version always comes from the manifest.
      - name: Decide what this run does
        id: mode
        run: |
          echo "version=$(node -p "require('./plugin-source/families.json').root.version")" >> "$GITHUB_OUTPUT"
          case "${{ github.event_name }}" in
            push) echo "dry_run=false" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch) echo "dry_run=${{ inputs.clawhub_dry_run }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "dry_run=true" >> "$GITHUB_OUTPUT" ;;
          esac

      # Fail loudly rather than skipping: a real publish that silently does
      # nothing looks identical to a successful one in the run summary.
      - name: Require a token for a real publish
        if: steps.mode.outputs.dry_run == 'false'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::CLAWHUB_TOKEN is not configured, so this publish would do nothing."
            exit 1
          fi
          echo "✅ token present"

      # The CLI reads the config file `clawhub login` writes, not the
      # environment (same as publish-clawhub-skills.yml).
      - name: Log in
        if: steps.mode.outputs.dry_run == 'false'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: npx --yes clawhub@0.23.3 login --token "$CLAWHUB_TOKEN" --no-browser

      # The display name travels in the manifest (#195), so no --display-name.
      - name: Publish the rotifer package
        run: |
          VERSION="${{ steps.mode.outputs.version }}"
          ARGS=(
            package publish "$GITHUB_WORKSPACE/plugins/rotifer"
            --family bundle-plugin
            --version "$VERSION"
            --tags latest
            --changelog "Root plugin family $VERSION. https://github.com/${{ github.repository }}/releases/tag/root-plugin-v$VERSION"
            --json
            --source-repo "${{ github.repository }}"
            --source-commit "${{ github.sha }}"
            --source-ref "${{ github.ref }}"
            --source-path plugins/rotifer
          )
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
            echo "Dry run — nothing will be published."
          fi
          npx --yes clawhub@0.23.3 "${ARGS[@]}"

      # A publish is held for security scans before it becomes the listing's
      # latest (minutes, sometimes longer). Still pending at the deadline is
      # not a failure, so it is reported, not failed.
      - name: Confirm the listing moved
        if: steps.mode.outputs.dry_run == 'false'
        run: |
          VERSION="${{ steps.mode.outputs.version }}"
          for attempt in $(seq 1 20); do
            LATEST="$(npx --yes clawhub@0.23.3 package inspect rotifer --json 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).package.latestVersion)}catch{console.log("")}})')"
            echo "attempt $attempt: latest=$LATEST"
            if [ "$LATEST" = "$VERSION" ]; then
              echo "✅ ClawHub rotifer latest is $VERSION"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::ClawHub rotifer latest is still ${LATEST:-unknown}, not $VERSION, after 10 minutes. It is likely held for scans; check with: npx clawhub@0.23.3 package inspect rotifer --versions"
