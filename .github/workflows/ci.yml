name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Rust/npm version alignment
        run: npm run verify:versions

      - name: TypeScript type check
        run: npm run lint

  plugin-source:
    name: Plugin Source Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check generated plugin outputs
        run: npm run check:plugins

      - name: Verify plugin packaging references
        run: npm run verify:plugins

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  vscode-extension:
    name: VSCode Extension Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install extension dependencies
        working-directory: rotifer-vscode
        run: npm ci

      - name: Run extension tests
        working-directory: rotifer-vscode
        run: npm test

  vscode-packaging:
    name: VSCode Extension Packaging
    runs-on: ubuntu-latest
    needs: [plugin-source]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        working-directory: rotifer-vscode
        run: npm ci

      - name: Package VSCode extension
        working-directory: rotifer-vscode
        run: |
          mkdir -p ../artifacts
          npx --yes @vscode/vsce package --out ../artifacts/rotifer-vscode-ci.vsix

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, plugin-source, test, rust-check, security-check, vscode-extension, vscode-packaging, supabase-migrations]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          node dist/index.js --version

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Cargo check (all crates)
        run: cargo check --workspace

      - name: Cargo test (core)
        run: cargo test -p rotifer-core

      - name: Build napi bridge (verify compilation)
        run: |
          npm install -g @napi-rs/cli
          cd crates/rotifer-napi && napi build --release --platform

      - name: Cargo clippy (all crates)
        run: cargo clippy --workspace -- -D warnings

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    needs: [rust-check, test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cargo dependency audit
        run: |
          # cargo-audit 0.22+ is required to parse current RustSec CVSS 4.0 advisories.
          cargo install cargo-audit@0.22.1 --quiet
          # RUSTSEC-2026-0114: wasmtime 42.0.2 panic on oversized table alloc.
          # Medium severity (5.9) — DoS via panic, NOT RCE; sandbox isolation contains impact.
          # Tracked for upgrade to wasmtime 43.0.2+ in a dedicated PR.
          # RUSTSEC-2026-0118 / -0119: hickory-proto DoS, reachable only via libp2p's
          # optional dns/mdns features, which we do NOT enable — the DNS code is never
          # compiled into the binary (it only lingers in Cargo.lock as a disabled
          # optional dependency). -0118 has no fixed release. Tracked: move to libp2p
          # component crates to drop it from the lockfile entirely.
          cargo audit --ignore RUSTSEC-2026-0114 --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119

      - name: npm dependency audit
        run: npm audit --audit-level=high

      - name: WASM sandbox security tests
        run: cargo test -p rotifer-core --test wasm_security

      - name: Full Rust test suite (regression check)
        run: cargo test -p rotifer-core

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Self-scan (V(g) security)
        run: |
          npm run build
          node dist/index.js vg . --json

      - name: Scan for cross-contamination
        run: |
          echo "Scanning full commit history for private file paths..."
          CONTAMINATED=$(git log --all --diff-filter=A --name-only --format="" | grep "^internal/" | sort -u || true)
          if [ -n "$CONTAMINATED" ]; then
            echo "::error::⛔ CRITICAL: private files found in commit history!"
            echo "$CONTAMINATED"
            echo "This public repo must NEVER contain private files."
            exit 1
          else
            echo "✅ No contamination detected"
          fi

      - name: Report security scan to Observatory
        if: github.ref == 'refs/heads/main' && env.QUALITY_SUPABASE_URL != ''
        env:
          QUALITY_SUPABASE_URL: ${{ secrets.QUALITY_SUPABASE_URL }}
          QUALITY_SUPABASE_KEY: ${{ secrets.QUALITY_SUPABASE_SERVICE_KEY }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NPM_AUDIT=$(npm audit --json --registry https://registry.npmjs.org/ 2>/dev/null || echo '{}')
          CRITICAL=$(echo "$NPM_AUDIT" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).metadata?.vulnerabilities?.critical||0}catch{0}")
          HIGH=$(echo "$NPM_AUDIT" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).metadata?.vulnerabilities?.high||0}catch{0}")
          MODERATE=$(echo "$NPM_AUDIT" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).metadata?.vulnerabilities?.moderate||0}catch{0}")
          LOW=$(echo "$NPM_AUDIT" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).metadata?.vulnerabilities?.low||0}catch{0}")
          TOTAL=$(echo "$NPM_AUDIT" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).metadata?.dependencies?.total||0}catch{0}")

          GRADE="PASS"
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then GRADE="FAIL"; fi

          curl -s -X POST "${QUALITY_SUPABASE_URL}/rest/v1/security_scan_results" \
            -H "apikey: ${QUALITY_SUPABASE_KEY}" \
            -H "Authorization: Bearer ${QUALITY_SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"version\":\"v${VERSION}\",\"component\":\"cli\",\"scan_type\":\"npm_audit\",\"grade\":\"${GRADE}\",\"severity_counts\":{\"critical\":${CRITICAL},\"high\":${HIGH},\"moderate\":${MODERATE},\"low\":${LOW}},\"source\":\"ci\",\"ci_run_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            && echo "✅ Security scan reported" || echo "⚠️ Report failed (non-blocking)"

          curl -s -X POST "${QUALITY_SUPABASE_URL}/rest/v1/dependency_audit_logs" \
            -H "apikey: ${QUALITY_SUPABASE_KEY}" \
            -H "Authorization: Bearer ${QUALITY_SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"component\":\"cli\",\"audit_tool\":\"npm_audit\",\"total_deps\":${TOTAL},\"vulnerabilities\":{\"critical\":${CRITICAL},\"high\":${HIGH},\"moderate\":${MODERATE},\"low\":${LOW}},\"ci_run_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            && echo "✅ Dependency audit reported" || echo "⚠️ Report failed (non-blocking)"

  supabase-migrations:
    name: Supabase Migration Replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: supabase/setup-cli@b579fc8c7122aa485f1d947120eaeb11ee04d312 # v2.0.0
        with:
          version: 2.67.1

      - name: Verify migration chain replays cleanly
        # `supabase start` internally runs `db reset` which applies every
        # migration in supabase/migrations/ from scratch. A clean exit
        # proves dev/prod parity (no SQLSTATE 42P13 return-type drift,
        # missing extensions, etc). Source: v0.8.8 dev/prod parity sprint
        # (rotifer-playground commit 9d8076b + this sprint).
        run: supabase start

      - name: Run pgTAP test suite
        run: |
          # B-R6 sprint (2026-05-17) closed every known v0.9 stage-2 failure:
          #   - plan() count corrected to 57 (B.1=11, B.2=9, B.3=9,
          #     B.4=7, B.5=6, B.6=7, B.7=5, B.8=3)
          #   - B.2.1 uses SAVEPOINT to mark every season ended,
          #     exercise the no-active-season branch, then ROLLBACK so
          #     B.2.2 happy path still sees an active season
          #   - B.2.8 / B.7.5 anon EXECUTE drop closed by hardening
          #     migration 20260517040000 (REVOKE FROM PUBLIC, not just
          #     anon — Postgres functions default to PUBLIC EXECUTE)
          #   - B.7.2 anon table privs reduced to SELECT-only by the
          #     same hardening migration
          # The suite is now blocking — any drift fails CI.
          supabase test db

      - name: Stop supabase
        if: always()
        run: supabase stop --no-backup || true

  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: Install gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Run gitleaks
        run: |
          "$(go env GOPATH)/bin/gitleaks" git . --config .gitleaks.toml --no-banner --redact

  broken-links:
    name: Broken Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # Self-contained relative-link checker (ADR-294 D3). Skips genes/:
      # published Gene SKILL bundles may reference optional companion assets
      # not shipped in minimal layout — gene link hygiene tracked via gene-audit.
      - name: Check relative markdown links (offline, repo-local only)
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          from urllib.parse import unquote
          INLINE = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          SCHEME = re.compile(r'^[a-zA-Z][a-zA-Z0-9+.-]*:')
          FENCE = re.compile(r'^\s*(```|~~~)')
          SKIP = {'.git', 'node_modules', 'genes'}
          broken, scanned = [], 0
          for md in pathlib.Path('.').rglob('*.md'):
              if any(p in SKIP for p in md.parts):
                  continue
              scanned += 1
              in_fence = False
              for line in md.read_text(encoding='utf-8', errors='replace').splitlines():
                  if FENCE.match(line):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  for m in INLINE.finditer(line):
                      raw = m.group(1).strip()
                      target = (raw.split()[0] if raw else '').split('#', 1)[0]
                      if (not target or target.startswith('#')
                              or target.startswith('/') or SCHEME.match(target)):
                          continue
                      if not (md.parent / unquote(target)).exists():
                          broken.append(f"{md}: {raw}")
          print(f"scanned {scanned} markdown files")
          if broken:
              print("::error::Broken relative links found:")
              for b in broken:
                  print(b)
              sys.exit(1)
          print("✅ No broken relative links")
          PY

  report-quality:
    name: Report to Quality Observatory
    runs-on: ubuntu-latest
    needs: [test, vscode-extension, security-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run tests with JSON reporter + coverage
        run: |
          npm run build
          npx vitest run --reporter=json --outputFile=test-results.json --coverage 2>/dev/null || true

      - name: Report test results to Supabase
        if: env.QUALITY_SUPABASE_URL != ''
        env:
          QUALITY_SUPABASE_URL: ${{ secrets.QUALITY_SUPABASE_URL }}
          QUALITY_SUPABASE_KEY: ${{ secrets.QUALITY_SUPABASE_SERVICE_KEY }}
        run: |
          if [ ! -f test-results.json ]; then
            echo "No test results file found, skipping report"
            exit 0
          fi

          VERSION=$(node -p "require('./package.json').version")
          RELEASE_LINE_VERSION="v${VERSION}"
          TOTAL=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).numTotalTests || 0")
          PASSED=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).numPassedTests || 0")
          FAILED=$(node -p "JSON.parse(require('fs').readFileSync('test-results.json','utf8')).numFailedTests || 0")
          DURATION=$(node -p "Math.round(JSON.parse(require('fs').readFileSync('test-results.json','utf8')).testResults?.reduce((s,r) => s + (r.endTime - r.startTime), 0) || 0)")

          COVERAGE_PCT=0
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE_PCT=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total?.lines?.pct || 0")
          fi

          curl -s -X POST "${QUALITY_SUPABASE_URL}/rest/v1/release_test_reports" \
            -H "apikey: ${QUALITY_SUPABASE_KEY}" \
            -H "Authorization: Bearer ${QUALITY_SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"version\": \"v${VERSION}\",
              \"release_line_version\": \"${RELEASE_LINE_VERSION}\",
              \"component\": \"cli\",
              \"test_type\": \"unit\",
              \"total_tests\": ${TOTAL},
              \"passed\": ${PASSED},
              \"failed\": ${FAILED},
              \"duration_ms\": ${DURATION},
              \"coverage_pct\": ${COVERAGE_PCT},
              \"ci_run_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"
            }" && echo "✅ Reported to Quality Observatory (coverage: ${COVERAGE_PCT}%)" || echo "⚠️ Report failed (non-blocking)"
