[package]
name = "rotifer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Core library for the Rotifer Protocol — types, sandbox, arena, algebra, fitness, IR compiler"
repository.workspace = true
homepage = "https://rotifer.dev"
readme = "README.md"
keywords = ["ai", "agent", "wasm", "evolution", "gene"]
categories = ["wasm", "science"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
wasmtime.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
hex.workspace = true
rmp-serde.workspace = true
serde_jcs.workspace = true
prost.workspace = true
wasm-encoder.workspace = true
wasmparser.workspace = true
tokio.workspace = true
base64.workspace = true
ureq.workspace = true
url.workspace = true
# `mdns` pulls hickory-proto. Since libp2p 0.57 (libp2p-mdns 0.49) that is
# hickory-proto ^0.26, clear of RUSTSEC-2026-0118 (unaffected >= 0.26.0-beta.1)
# and RUSTSEC-2026-0119 (patched >= 0.26.1); `cargo tree -i hickory-proto` must
# show no 0.25.x. `dns` stays omitted: no `/dns4/` bootstrap is wired yet.
libp2p = { workspace = true, features = [
    "mdns",
    "tcp",
    "quic",
    "noise",
    "yamux",
    "gossipsub",
    "kad",
    "identify",
    "memory-connection-limits",
    "tokio",
    "ed25519",
    "macros",
] }

# libp2p-quic 0.14 (libp2p 0.57) brings aws-lc-sys in through quinn's
# rustls-aws-lc-rs. Its x86_64 Windows build needs NASM on PATH; this feature-only
# line makes it use the prebuilt NASM objects instead, so the windows-x64 napi
# target builds on a stock runner. Adds no crate of its own.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
aws-lc-rs = { version = "1.19", default-features = false, features = ["prebuilt-nasm"] }

[features]
# Opt-in marker for the multi-node P2P integration tests in src/p2p/. Those tests
# are `#[cfg_attr(not(feature = "p2p-integration"), ignore)]` — ignored by default
# (so `cargo test` stays fast + deterministic) and run in the dedicated CI job via
# `cargo test --features p2p-integration -- --test-threads=1`. Empty: no build effect.
p2p-integration = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
